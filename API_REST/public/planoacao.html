<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Ações — Alertas</title>
  <link rel="stylesheet" href="planoacao.css">
</head>
<body>

  <div class="topo">
    <div>
      <h1>Plano de Ações</h1>
      <p class="sub">Farol de tratamento dos alertas de segurança</p>
    </div>
     <a href="index.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <path d="M9 22V12h6v10"/>
                    </svg>
                    Início
                </a>
  </div>

  <div id="alerta-msg" class="msg" style="display:none;"></div>

  <!-- Resumo do farol -->
  <div class="farol-resumo" id="farol-resumo"></div>

  <!-- Filtros -->
  <div class="filtros">
    <input type="text" id="busca" placeholder="🔍 Buscar alerta por descrição, unidade..." oninput="render()" />
    <select id="filtro-status" onchange="render()">
      <option value="todos">Todos os status</option>
      <option value="sem_plano">Sem plano</option>
      <option value="Aberto">Aberto</option>
      <option value="Em tratamento">Em tratamento</option>
      <option value="Concluído">Concluído</option>
      <option value="Atrasado">Atrasado</option>
    </select>
  </div>

  <!-- Lista de alertas -->
  <div id="lista-alertas" class="lista-alertas"></div>

  <!-- Modal: criar/editar plano -->
  <div id="modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3 id="modal-titulo">Novo Plano de Ação</h3>
      <div class="alerta-ref" id="alerta-ref"></div>

      <input type="hidden" id="planoId" />
      <input type="hidden" id="alertaId" />

      <div class="grid-2">
        <div class="campo">
          <label>O quê? <span class="req">*</span></label>
          <textarea id="f-oque" rows="2" placeholder="A ação a ser tomada"></textarea>
        </div>
        <div class="campo">
          <label>Por quê?</label>
          <textarea id="f-porque" rows="2" placeholder="Justificativa"></textarea>
        </div>
        <div class="campo">
          <label>Onde?</label>
          <input type="text" id="f-onde" placeholder="Local" />
        </div>
        <div class="campo">
          <label>Quem? <span class="req">*</span></label>
          <input type="text" id="f-quem" placeholder="Responsável" />
        </div>
        <div class="campo">
          <label>Quando? (prazo) <span class="req">*</span></label>
          <input type="date" id="f-quando" />
        </div>
        <div class="campo">
          <label>Quanto?</label>
          <input type="text" id="f-quanto" placeholder="Custo estimado" />
        </div>
        <div class="campo campo-full">
          <label>Como?</label>
          <textarea id="f-como" rows="2" placeholder="Como será feito"></textarea>
        </div>
      </div>

      <div class="grid-3 bloco-status">
        <div class="campo">
          <label>Status</label>
          <select id="f-status" onchange="onStatusChange()">
            <option value="Aberto">Aberto</option>
            <option value="Em tratamento">Em tratamento</option>
            <option value="Concluído">Concluído</option>
          </select>
        </div>
        <div class="campo">
          <label>Data de Início</label>
          <input type="date" id="f-inicio" />
        </div>
        <div class="campo">
          <label>Data de Fim</label>
          <input type="date" id="f-fim" />
        </div>
      </div>

      <div class="modal-btns">
        <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        <button class="btn-salvar" onclick="salvarPlano()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="planoacao.js"></script>
</body>
</html>
